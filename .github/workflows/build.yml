name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve dependencies
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup.sh --check-only

      - name: Build app bundle
        run: |
          chmod +x scripts/*.sh
          UNIVERSAL=1 CONFIG=release VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
        shell: bash

      - name: Verify bundle
        run: |
          test -x "build/OpenCode Hub.app/Contents/MacOS/OpenCodeHub"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/OpenCode Hub.app/Contents/Info.plist"
          lipo -archs "build/OpenCode Hub.app/Contents/MacOS/OpenCodeHub" | grep -q x86_64
          lipo -archs "build/OpenCode Hub.app/Contents/MacOS/OpenCodeHub" | grep -q arm64
          file "build/OpenCode Hub.app/Contents/MacOS/OpenCodeHub"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/OpenCode Hub.app" "build/OpenCodeHub.zip"
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCodeHub-app
          path: build/OpenCodeHub.zip
          if-no-files-found: error

  release:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCodeHub-app
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenCodeHub.zip
