name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM and Xcode build products
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: build-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'project.yml') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Verify toolchain and dependencies
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup.sh --check-only

      - name: SwiftPM compile gate
        run: swift build -c release

      - name: Build native app bundle
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          UNIVERSAL=1 CONFIG=release ./scripts/build-app.sh
        shell: bash

      - name: Verify bundle
        run: |
          APP="build/Open Code Hub.app"
          BIN="$APP/Contents/MacOS/Open Code Hub"
          test -d "$APP"
          test -x "$BIN"
          lipo -archs "$BIN" | grep -q x86_64
          lipo -archs "$BIN" | grep -q arm64
          test -f "$APP/Contents/Resources/Assets.car"
          test -f "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          codesign -dv --entitlements :- "$APP" 2>&1 | head -20
          file "$BIN"

      - name: Launch smoke test
        run: |
          APP="build/Open Code Hub.app"
          if ! open "$APP" 2>/tmp/open.err; then
            echo "no GUI session available here; skipping the launch check"
            cat /tmp/open.err || true
            exit 0
          fi
          sleep 8
          if pgrep -f "Contents/MacOS/Open Code Hub" >/dev/null; then
            echo "app launched and stayed up"
          else
            echo "::error::app exited during launch"
            log show --last 3m --predicate 'process == "Open Code Hub"' --style compact 2>/dev/null | tail -40 || true
            for f in ~/Library/Logs/DiagnosticReports/*.crash; do [ -f "$f" ] && head -60 "$f"; done
            exit 1
          fi
          osascript -e 'tell application "Open Code Hub" to quit' 2>/dev/null || pkill -f "Contents/MacOS/Open Code Hub" || true

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/Open Code Hub.app" "build/OpenCodeHub.zip"
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCodeHub-app
          path: build/OpenCodeHub.zip
          if-no-files-found: error

  release:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCodeHub-app
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenCodeHub.zip
          generate_release_notes: true
